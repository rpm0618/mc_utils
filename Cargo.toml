[package]
name = "mc_utils"
version = "0.1.0"
edition = "2021"
default-run = "viewer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "mc_utils"
path = "src/main.rs"

[lib]
name = "mc_utils"
path = "src/lib/lib.rs"


[dependencies]
quartz_nbt = "0.2.9"
valence_nbt = { version = "0.8.0", features = ["binary", "java_string", "preserve_order"] }

rayon = "1.11.0"

ggez = "0.9.3"
egui = "0.32.0"
tinyfiledialogs = "3.9.1"

flate2 = "1.1.9"
java_string = { version = "0.1.3", features = ["serde"] }
byteorder = "1.5.0"
num_enum = "0.7.5"

base64 = "0.22.1"
serde = "1.0.228"
serde_json = "1.0.149"

mio = { version = "1.1.1", features = ["os-poll", "net"] }

thiserror = "2.0.18"
anyhow = "1.0.102"
indexmap = "2.13.0"
bitflags = "2.11.0"

[profile.dev.package."*"]
opt-level = 2